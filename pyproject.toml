[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wiser-dom"
version = "0.5.0"
authors = [
    { name = "Andrei Pomorov", email = "apomorov@usf.edu" }
]
description = "Hybrid classical and quantum solver for Distributed Order Management"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "pyyaml",
]

[project.optional-dependencies]
ibm = [
    "qiskit>=2.5,<3",
    "qiskit-ibm-runtime>=0.47,<1",
]

gpu = [
    "cupy-cuda12x>=13.0; (platform_system == 'Linux' and platform_machine == 'x86_64') or (platform_system == 'Windows' and platform_machine == 'AMD64')",
]

gurobi = [
    "gurobipy>=11,<14",
]

highs = [
    "highspy>=1.10,<2",
]

scip = [
    "pyscipopt>=5.5,<6",
]

open-source-solvers = [
    "highspy>=1.10,<2",
    "pyscipopt>=5.5,<6",
]

app = [
    "streamlit>=1.61,<2",
]

notebook = [
    "jupyterlab",
    "ipykernel",
    "matplotlib>=3.8",
    "nbformat>=5.10",
]

dev = [
    "matplotlib>=3.8",
    "pytest",
    "ruff",
]

full = [
    "cupy-cuda12x>=13.0; (platform_system == 'Linux' and platform_machine == 'x86_64') or (platform_system == 'Windows' and platform_machine == 'AMD64')",
    "gurobipy>=11,<14",
    "highspy>=1.10,<2",
    "pyscipopt>=5.5,<6",
    "qiskit>=2.5,<3",
    "qiskit-ibm-runtime>=0.47,<1",
    "streamlit>=1.61,<2",
    "ipykernel",
    "jupyterlab",
    "matplotlib>=3.8",
    "nbformat>=5.10",
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
